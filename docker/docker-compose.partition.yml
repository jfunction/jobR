# Overlay: a worker whose link goes dark mid-run.
#
#   docker/run.sh docker/docker-compose.netem.yml docker/docker-compose.partition.yml
#
# The impaired worker's link drops to 100% loss 30 seconds in and stays dark
# for 25 -- longer than the 15-second lease, so whatever chunk it was holding
# lapses and is reissued while it is gone. Then the link returns, and the
# worker has to still be there.
#
# Why the steady worker is capped. Without a cap this scenario passes while
# demonstrating nothing: the healthy worker finishes the jobset alone, every
# assertion holds, and the impaired worker's disappearance never shows up.
# Capping it at 20 of the 40 chunks means the remaining 20 can only be done by
# the impaired worker, so "all 40 chunks done" is true if and only if that
# worker came back. The existing assertions then carry the weight, and no new
# assertion machinery is needed.
#
# A passing run reads:
#
#   == netem: partition starts ==
#     lost contact with the host (no reply: 5 | Timed out); retrying for up to 60s
#   worker done: 20 chunks                 <- the steady worker reaches its cap
#   == netem: partition ends ==
#     back in touch with the host          <- and picks up chunk 32
#   == OK == all 200 jobs, all 40 chunks done
#
# The impaired worker does 20 of the 40 chunks, roughly half of them after
# returning from the blackout. The other worker has already stopped by then,
# so nothing else could have done them.

services:
  host:
    environment:
      # A failing run should fail fast. If the impaired worker never comes
      # back, the last 20 chunks are never done and the host waits out this
      # deadline before saying so. A passing run needs roughly 90 seconds.
      JOBR_DEADLINE: "150"

  worker-steady:
    environment:
      JOBR_MAX_CHUNKS: "20"
      JOBR_MAX_SECONDS: "150"

  worker-flaky:
    environment:
      JOBR_MAX_SECONDS: "150"

  netem:
    environment:
      NETEM_PARTITION_AT: "30"
      NETEM_PARTITION_FOR: "25"
