# Overlay: the machine goes dark mid-run.
#
#   docker/run.sh docker/docker-compose.netem.yml docker/docker-compose.partition.yml
#
# The impaired worker's link drops to 100% loss 30 seconds in and stays dark
# for 25 -- longer than the 15-second lease, so whatever chunk it was holding
# lapses and is reissued to someone else while it is gone. Then the link comes
# back, and the worker has to still be there.
#
# Why the steady worker is capped. Without a cap this scenario passes while
# demonstrating nothing: the healthy worker quietly finishes the jobset alone,
# every assertion holds, and the impaired worker's disappearance never shows
# up. Capping it at 20 of the 40 chunks means the remaining 20 can ONLY be
# done by the impaired worker, so "all 40 chunks done" is true if and only if
# that worker came back. The existing assertions then carry the weight; no new
# assertion machinery is needed.
#
# This file was written to fail. It did, for one commit, and that failure is
# what the fix was built against:
#
#   partition starts
#   host vanished before chunk 22 was accepted   <- worker exits, 9 chunks in
#   partition ends, 15.6 seconds too late for anyone to notice
#   == FAILED == 145 of 200 jobs, 11 of 40 chunks not done
#
# What happens now:
#
#   partition starts
#   lost contact with the host (no reply: 5 | Timed out); retrying for up to 60s
#   worker done: 20 chunks                       <- the steady worker hits its cap
#   partition ends
#   back in touch with the host                  <- and picks up chunk 32
#   == OK == all 200 jobs, all 40 chunks done
#
# The impaired worker did 20 of the 40 chunks, 11 of them after coming back
# from a blackout that used to be fatal. The other worker had already stopped,
# so nothing else could have done them.

services:
  host:
    environment:
      # A failing run should fail fast. If the impaired worker never comes
      # back, the last 20 chunks are never done and the host waits out this
      # deadline before saying so. A passing run needs roughly 90 seconds.
      JOBR_DEADLINE: "150"

  worker-steady:
    environment:
      JOBR_MAX_CHUNKS: "20"
      JOBR_MAX_SECONDS: "150"

  worker-flaky:
    environment:
      JOBR_MAX_SECONDS: "150"

  netem:
    environment:
      NETEM_PARTITION_AT: "30"
      NETEM_PARTITION_FOR: "25"
