name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Unit, property and single-machine integration tests. Fast, and where most
  # failures will be caught.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat, any::callr, any::mirai
      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: "true"
          JOBR_INTEGRATION: "1"
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  # The multi-node testbed: separate containers, separate R versions, a real
  # network between them. This is the part a single machine cannot test.
  testbed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # run.sh, not `up --exit-code-from host`: that flag aborts the run when any
      # container exits, and the host is deliberately the last to go. It also
      # streams every container's logs here, so there is no separate
      # show-logs-on-failure step.
      - name: Run the mixed-version testbed
        run: docker/run.sh docker/docker-compose.yml
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # The same package over a link that is genuinely bad: 150ms +/- 50ms of
  # delay and 5% loss on one worker, shaped with tc netem from a sidecar. The
  # assertion is that TWO machines appear in the results, so a worker that
  # cannot survive its link fails the job rather than being quietly carried by
  # the healthy one.
  #
  # The blackout overlay runs too. It asserts that a worker whose link dies for
  # 25 seconds comes back and finishes the work, with the healthy worker capped
  # so that nothing else can. That assertion failed when it was written, which
  # is why it was written; it is in CI so it cannot quietly start failing again.
  impaired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check the kernel can actually shape a link
        # netem needs sch_netem. If it is missing, every impaired run would
        # silently be an unimpaired one -- except that the worker's RTT gate
        # would stall instead, and the failure would look like a dead host.
        # Fail here, where the message is honest.
        run: |
          docker run --rm --cap-add NET_ADMIN alpine:3.20 sh -c 'apk add --no-cache iproute2 >/dev/null && tc qdisc add dev eth0 root netem delay 10ms && tc qdisc show dev eth0'
      # run.sh streams every container's logs into this step's output, so
      # there is no separate "show logs on failure" step to add here.
      - name: Run the impaired-network scenario
        run: docker/run.sh docker/docker-compose.netem.yml
      - name: Run the blackout scenario
        run: docker/run.sh docker/docker-compose.netem.yml docker/docker-compose.partition.yml
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.netem.yml down -v
